{% extends 'base.html' %}
{% block title %}Admin Login — VTRY{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(232,196,255,0.06) 0%,transparent 70%)">
  <div style="width:100%;max-width:400px" class="anim-scale">
    <div style="text-align:center;margin-bottom:2.5rem">
      <div style="width:64px;height:64px;background:rgba(232,196,255,0.1);border:1px solid rgba(232,196,255,0.2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1rem">🛡</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;margin-bottom:0.4rem">Admin Panel</h2>
      <p style="color:var(--text-muted);font-size:0.88rem">Sign in to manage VTRY system</p>
    </div>
    <div class="card" style="border-color:rgba(232,196,255,0.12)">
      <form method="POST">
        <div class="form-group">
          <label>Admin Username</label>
          <input type="text" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.85rem;background:linear-gradient(135deg,#e8c4ff,#c8a96e);color:#000">Sign In as Admin →</button>
      </form>
      <div class="divider"></div>
      <p style="text-align:center;font-size:0.82rem;color:var(--text-muted)">Default credentials: <strong style="color:var(--text-soft)">admin / admin123</strong></p>
    </div>
    <p style="text-align:center;margin-top:1.2rem;font-size:0.82rem"><a href="/login" style="color:var(--text-muted)">← Back to User Login</a></p>
  </div>
</div>
{% endblock %}
